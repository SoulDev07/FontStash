<svg width="840" height="250" viewBox="0 0 840 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FontStash - Local Typography Studio &amp; Font Workbench">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      .brand-title {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 38px;
        font-weight: 700;
        fill: #ffffff;
        letter-spacing: -0.03em;
      }
      .brand-sub {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        font-weight: 400;
        fill: #a1a1aa;
        letter-spacing: -0.01em;
      }
      .brand-tag {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 500;
        fill: #e4e4e7;
      }
      .brand-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10.5px;
        font-weight: 500;
        fill: #e4e4e7;
      }
    </style>
  </defs>

  <!-- Solid Obsidian Background -->
  <rect width="840" height="250" fill="#000000"/>

  <!-- Centered Card Container -->
  <rect x="24" y="14" width="792" height="222" rx="6" fill="#060608" stroke="#222226" stroke-width="1"/>

  <!-- Centered Content -->
  <g transform="translate(420, 43)" text-anchor="middle">
    <!-- Brand Logo Mark (4px radius) -->
    <g transform="translate(-22, 0) scale(1.4)">
      <rect x="0.5" y="0.5" width="31" height="31" rx="4" fill="#000000" stroke="#333338" stroke-width="1"/>
      <path fill-rule="evenodd" clip-rule="evenodd" d="M12.8 6.5H25L22.2 9.5H15.4L13.8 13.5H21.5L18.8 16.5H12.6L9 25.5H6L12.8 6.5Z" fill="#ffffff"/>
      <path d="M18 21.5H24.5L23 24.5H16.5L18 21.5Z" fill="#ffffff"/>
    </g>

    <!-- Main Title (reduced to 38px) -->
    <text y="88" class="brand-title">
      FontStash
    </text>

    <!-- Subtitle -->
    <text y="116" class="brand-sub">
      Local-first typography playground &amp; font inspection workbench
    </text>

    <!-- Badges Row (Private & Offline, IndexedDB, TTF • OTF • WOFF2 only) -->
    <g transform="translate(0, 138)">
      <!-- Badge 1: Private & Offline -->
      <g transform="translate(-174, 0)">
        <rect x="0" y="0" width="108" height="26" rx="3" fill="#121215" stroke="#2a2a2e" stroke-width="1"/>
        <text x="54" y="17" class="brand-tag" text-anchor="middle">Private &amp; Offline</text>
      </g>

      <!-- Badge 2: IndexedDB -->
      <g transform="translate(-54, 0)">
        <rect x="0" y="0" width="80" height="26" rx="3" fill="#121215" stroke="#2a2a2e" stroke-width="1"/>
        <text x="40" y="17" class="brand-tag" text-anchor="middle">IndexedDB</text>
      </g>

      <!-- Badge 3: TTF • OTF • WOFF2 -->
      <g transform="translate(38, 0)">
        <rect x="0" y="0" width="136" height="26" rx="3" fill="#121215" stroke="#2a2a2e" stroke-width="1"/>
        <text x="68" y="17" class="brand-mono" text-anchor="middle">TTF • OTF • WOFF2</text>
      </g>
    </g>
  </g>
</svg>
