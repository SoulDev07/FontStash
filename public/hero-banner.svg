<svg width="1200" height="540" viewBox="0 0 1200 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FontStash - Local-first font playground</title>
  <desc id="desc">Brand hero for GitHub social previews: dark gradient, neon primary/accent glows, gradient logomark, bold title, and concise tagline.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0b0d"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>

    <radialGradient id="glowPrimary" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1020 40) rotate(35) scale(560 320)">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAccent" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 520) rotate(-25) scale(600 320)">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="360" y1="240" x2="840" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>

    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.02"/>
      </feComponentTransfer>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="540" fill="url(#bg)"/>
  <rect width="1200" height="540" fill="url(#glowPrimary)"/>
  <rect width="1200" height="540" fill="url(#glowAccent)"/>
  <rect width="1200" height="540" filter="url(#grain)" opacity="0.3"/>

  <!-- Centered brand block -->
  <g filter="url(#shadow)">
    <!-- Card -->
    <rect x="140" y="120" width="920" height="300" rx="28" fill="#111115" fill-opacity="0.65" stroke="#2a2a32"/>

    <!-- Logomark -->
    <g transform="translate(200,200) scale(1.4)">
      <rect x="6" y="6" width="52" height="52" rx="12" fill="url(#logoGrad)"/>
      <g fill="white" opacity="0.95">
        <path d="M20 42V22h18a2 2 0 1 1 0 4H24v6h9a2 2 0 1 1 0 4h-9v6h-4Z"/>
        <circle cx="44" cy="42" r="2.5"/>
      </g>
    </g>

    <!-- Title and tagline (moved up 14px) -->
    <text x="360" y="266" font-family="'Segoe UI','Inter','Arial',sans-serif" font-size="90" font-weight="800" fill="url(#titleGrad)">FontStash</text>
    <text x="360" y="308" font-family="'Segoe UI','Inter','Arial',sans-serif" font-size="26" fill="#e5e7eb" fill-opacity="0.95">Local-first font playground</text>

    <!-- Pills (kept extra 12px spacing below tagline) -->
    <g transform="translate(0,12)">
      <rect x="360" y="340" width="220" height="34" rx="17" fill="#15151a" stroke="#2a2a32"/>
      <circle cx="378" cy="357" r="5" fill="#22c55e"/>
      <text x="392" y="363" font-family="'Segoe UI','Inter','Arial',sans-serif" font-size="14" fill="#cfd2da">No backend</text>

      <rect x="594" y="340" width="210" height="34" rx="17" fill="#15151a" stroke="#2a2a32"/>
      <circle cx="612" cy="357" r="5" fill="#6366f1"/>
      <text x="626" y="363" font-family="'Segoe UI','Inter','Arial',sans-serif" font-size="14" fill="#cfd2da">Drop fonts in /public</text>

      <rect x="810" y="340" width="200" height="34" rx="17" fill="#15151a" stroke="#2a2a32"/>
      <circle cx="828" cy="357" r="5" fill="#e5e7eb"/>
      <text x="842" y="363" font-family="'Segoe UI','Inter','Arial',sans-serif" font-size="14" fill="#cfd2da">Next.js • Tailwind</text>
    </g>
  </g>

  <!-- Accent dots -->
  <circle cx="92" cy="86" r="4" fill="#22c55e"/>
  <circle cx="1108" cy="464" r="4" fill="#6366f1"/>
</svg>
