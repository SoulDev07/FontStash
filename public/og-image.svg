<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FontStash - Local Typography Studio &amp; Font Workbench">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      .og-title {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 62px;
        font-weight: 700;
        fill: #ffffff;
        letter-spacing: -0.035em;
      }
      .og-sub {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 21px;
        font-weight: 400;
        fill: #94a3b8;
        letter-spacing: -0.015em;
      }
      .og-tag {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #e4e4e7;
      }
      .og-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12.5px;
        font-weight: 500;
        fill: #e4e4e7;
      }
      .og-glyphs {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 32px;
        font-weight: 600;
        fill: #f1f5f9;
        letter-spacing: 0.12em;
      }
      .og-caption {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 400;
        fill: #64748b;
        letter-spacing: 0.02em;
      }
      .og-url {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        font-weight: 500;
        fill: #475569;
        letter-spacing: 0.08em;
      }
    </style>
    <radialGradient id="ogGlow" cx="600" cy="220" r="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="1200" height="630" fill="#060608"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>

  <!-- Outer Centered Card Container -->
  <rect x="48" y="36" width="1104" height="558" rx="14" fill="#090a0f" stroke="#1f212a" stroke-width="1.5"/>

  <!-- Centered Content -->
  <g transform="translate(600, 78)" text-anchor="middle">
    <!-- Brand Logo Mark (4px radius) -->
    <g transform="translate(-32, 0) scale(2.0)">
      <rect x="0.5" y="0.5" width="31" height="31" rx="4.5" fill="#000000" stroke="#333338" stroke-width="1"/>
      <path fill-rule="evenodd" clip-rule="evenodd" d="M12.8 6.5H25L22.2 9.5H15.4L13.8 13.5H21.5L18.8 16.5H12.6L9 25.5H6L12.8 6.5Z" fill="#ffffff"/>
      <path d="M18 21.5H24.5L23 24.5H16.5L18 21.5Z" fill="#ffffff"/>
    </g>

    <!-- Main Title -->
    <text y="126" class="og-title">
      FontStash
    </text>

    <!-- Subtitle -->
    <text y="168" class="og-sub">
      Local-first typography playground &amp; font inspection workbench
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 206)">
      <!-- Badge 1: Private & Offline -->
      <g transform="translate(-233, 0)">
        <rect x="0" y="0" width="144" height="32" rx="4" fill="#12131a" stroke="#262836" stroke-width="1"/>
        <text x="72" y="21" class="og-tag" text-anchor="middle">Private &amp; Offline</text>
      </g>

      <!-- Badge 2: IndexedDB -->
      <g transform="translate(-73, 0)">
        <rect x="0" y="0" width="110" height="32" rx="4" fill="#12131a" stroke="#262836" stroke-width="1"/>
        <text x="55" y="21" class="og-tag" text-anchor="middle">IndexedDB</text>
      </g>

      <!-- Badge 3: TTF • OTF • WOFF2 -->
      <g transform="translate(53, 0)">
        <rect x="0" y="0" width="180" height="32" rx="4" fill="#12131a" stroke="#262836" stroke-width="1"/>
        <text x="90" y="21" class="og-mono" text-anchor="middle">TTF • OTF • WOFF2</text>
      </g>
    </g>

    <!-- Specimen Preview Strip -->
    <g transform="translate(0, 276)">
      <rect x="-420" y="0" width="840" height="106" rx="8" fill="#101117" stroke="#1d1f29" stroke-width="1"/>
      <text x="0" y="50" class="og-glyphs" text-anchor="middle">Ag  Hk  Rq  Ww  123  &amp;  %  §</text>
      <text x="0" y="84" class="og-caption" text-anchor="middle">Local font ingestion • Binary metadata parsing • Specimen testing • Zero cloud uploads</text>
    </g>

    <!-- Footer URL -->
    <text y="440" class="og-url" text-anchor="middle">
      font-stash.souldev.me
    </text>
  </g>
</svg>
